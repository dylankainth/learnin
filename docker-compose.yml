services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@learnin.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-changeme-please}
    volumes:
      - pb_data:/pb_data
    ports:
      - "8090:8090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketbase.rule=Host(`pocketbase.learnin.local`)"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_started

  worker:
    build: ./server
    restart: unless-stopped
    command: ["node", "dist/workers/ingestWorker.js"]
    env_file: ./.env
    depends_on:
      redis:
        condition: service_started

volumes:
  pb_data:
  redis_data:
