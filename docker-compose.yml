services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@learnin.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-changeme-please}
    volumes:
      - pb_data:/pb_data
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      pocketbase:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./server
    restart: unless-stopped
    command: ["node", "dist/workers/ingestWorker.js"]
    env_file: ./server/.env
    depends_on:
      pocketbase:
        condition: service_healthy
      redis:
        condition: service_started

  # Optional: self-hosted Whisper transcription server for video uploads.
  # Uncomment and set WHISPER_API_URL=http://whisper:9000 in server/.env to enable.
  # whisper:
  #   image: onerahmet/openai-whisper-asr-webservice:latest
  #   restart: unless-stopped
  #   environment:
  #     ASR_MODEL: base
  #     ASR_ENGINE: faster_whisper

volumes:
  pb_data:
  redis_data:
