services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started

  worker:
    build: ./server
    restart: unless-stopped
    command: ["node", "dist/workers/ingestWorker.js"]
    env_file: ./server/.env
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started

  # Optional: self-hosted Whisper transcription server for video uploads.
  # Uncomment and set WHISPER_API_URL=http://whisper:9000 in server/.env to enable.
  # whisper:
  #   image: onerahmet/openai-whisper-asr-webservice:latest
  #   restart: unless-stopped
  #   environment:
  #     ASR_MODEL: base
  #     ASR_ENGINE: faster_whisper

volumes:
  redis_data:
  uploads:
